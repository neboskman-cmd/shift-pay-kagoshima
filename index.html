      const applyPayrollView=()=>{
        actual.classList.toggle('payroll-hidden',payrollView!=='actual');
        payout.classList.toggle('payroll-hidden',payrollView!=='estimate');
        estimate.classList.toggle('payroll-hidden',payrollView!=='estimate');
        toolbar.querySelectorAll('[data-pay-view]').forEach(b=>b.classList.toggle('active',b.dataset.payView===payrollView));
      };
      applyPayrollView();

      toolbar.querySelectorAll('[data-pay-view]').forEach(b=>b.onclick=()=>{
        payrollView=b.dataset.payView;
        applyPayrollView();
        window.scrollTo({top:0,behavior:'smooth'});
      });
      toolbar.querySelectorAll('[data-pay-month]').forEach(b=>b.onclick=()=>changeMonth(Number(b.dataset.payMonth)));
    }
  }
  if(state.tab==='calendar'){
    app.querySelector('.workplace-panel')?.remove();
    app.querySelector('.tax-panel')?.remove();
  }
  if(state.tab==='workplaces') app.querySelector('.tax-panel')?.remove();
  if(state.tab==='settings') app.querySelector('.workplace-panel')?.remove();
  app.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.tab;save();render()});
   app.querySelectorAll('[data-open-payroll]').forEach(el=>el.onclick=()=>{payrollView='estimate';state.tab='payroll';save();render();window.scrollTo({top:0,behavior:'smooth'})});
  
  app.querySelectorAll('[data-menu-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.menuTab;save();render();window.scrollTo({top:0,behavior:'smooth'})});
  app.querySelector('[data-act="prev"]')?.addEventListener('click',()=>changeMonth(-1)); app.querySelector('[data-act="next"]')?.addEventListener('click',()=>changeMonth(1));
  app.querySelector('#month')?.addEventListener('change',e=>{state.month=e.target.value;save();render()});
  app.querySelector('[data-act="ics"]')?.addEventListener('click',exportIcs);
  app.querySelectorAll('[data-adddate]').forEach(el=>el.onclick=()=>openShiftPicker(el.dataset.adddate));
  app.querySelectorAll('[data-pick-workplace]').forEach(el=>el.onclick=()=>addShiftForDate(selectedShiftDate,el.dataset.pickWorkplace,el.dataset.pickKind));
  app.querySelectorAll('[data-edit-shift]').forEach(el=>el.onclick=()=>openShiftEditor(el.dataset.editShift));
  app.querySelectorAll('[data-edit-save]').forEach(el=>el.onclick=()=>saveShiftTime(el.dataset.editSave));
   app.querySelector('[data-detail-close]')?.addEventListener('click',()=>{editingShiftId=null;render()});
   app.querySelector('[data-detail-close-button]')?.addEventListener('click',()=>{editingShiftId=null;render()});
   app.querySelectorAll('[data-detail-delete]').forEach(el=>el.onclick=()=>{if(confirm('このシフトを削除する？'))deleteShiftQuick(el.dataset.detailDelete)});
  app.querySelector('[data-edit-cancel]')?.addEventListener('click',()=>{editingShiftId=null;render()});
  app.querySelectorAll('[data-quick-del]').forEach(el=>el.onclick=()=>deleteShiftQuick(el.dataset.quickDel));
  app.querySelector('[data-picker-close]')?.addEventListener('click',()=>{selectedShiftDate=null;editingShiftId=null;render()});
  app.querySelector('[data-picker-close-button]')?.addEventListener('click',()=>{selectedShiftDate=null;editingShiftId=null;render()});
  app.querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>deleteShiftQuick(el.dataset.del));
  app.querySelectorAll('[data-rule]').forEach(el=>el.onchange=e=>setRule(el.dataset.rule,e.target.value));
  app.querySelectorAll('[data-id][data-key]').forEach(el=>el.onchange=e=>{let v=e.target.value;if(e.target.type==='number')v=Number(v);setField(el.dataset.id,el.dataset.key,v)});
  app.querySelectorAll('[data-setting]').forEach(el=>el.onchange=e=>{let v=e.target.value;if(e.target.type==='number')v=Number(v);setSetting(el.dataset.setting,v)});
  app.querySelector('[data-act="add-workplace"]')?.addEventListener('click',addWorkplace);
  app.querySelector('[data-act="add-payslip"]')?.addEventListener('click',addPayslipFromForm);
  app.querySelectorAll('[data-slip-del]').forEach(el=>el.onclick=()=>{state.actualPayslips=state.actualPayslips.filter(x=>x.id!==el.dataset.slipDel);save();render()});
  app.querySelectorAll('[data-workplace-shift]').forEach(el=>el.onchange=e=>applyWorkplace(el.dataset.workplaceShift,e.target.value));
  app.querySelectorAll('[data-wdel]').forEach(el=>el.onclick=()=>deleteWorkplace(el.dataset.wdel));
  app.querySelectorAll('[data-wid][data-wkey]').forEach(el=>el.onchange=e=>{let v=e.target.type==='checkbox'?e.target.checked:e.target.value;if(e.target.type==='number')v=Number(v);setWorkplace(el.dataset.wid,el.dataset.wkey,v)});
}
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script></body></html>
