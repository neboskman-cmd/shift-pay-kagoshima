function googleUrl(s){const {start,end}=shiftDates(s),w=state.workplaces.find(x=>x.id===s.workplaceId),q=new URLSearchParams({action:'TEMPLATE',text:`${w?.name||'勤務先'} ${s.workKind==='night'?'夜勤':'勤務'}`,dates:`${gdate(start)}/${gdate(end)}`,details:`${s.memo||''}\n休憩 ${s.breakMinutes}分`});return'https://calendar.google.com/calendar/render?'+q}
function icsLocal(d){const p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`}
function exportIcs(){const ev=state.shifts.filter(s=>s.date.startsWith(state.month)).map(s=>{const{start,end}=shiftDates(s);return['BEGIN:VEVENT',`UID:${s.id}@shift-pay-kagoshima`,`DTSTAMP:${icsLocal(new Date())}`,`DTSTART;TZID=Asia/Tokyo:${icsLocal(start)}`,`DTEND;TZID=Asia/Tokyo:${icsLocal(end)}`,`SUMMARY:${state.workplaces.find(w=>w.id===s.workplaceId)?.name||'勤務先'} ${s.workKind==='night'?'夜勤':'勤務'}`,`DESCRIPTION:${(s.memo||'').replace(/\n/g,'\\n')}\\n休憩 ${s.breakMinutes}分`,'END:VEVENT'].join('\r\n')}).join('\r\n');const text=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Shift Pay Kagoshima//JA','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:シフト',ev,'END:VCALENDAR'].join('\r\n');const b=new Blob([text],{type:'text/calendar;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`shift-${state.month}.ics`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

function correctionForWorkplace(workplaceId){const recs=state.actualPayslips.filter(x=>x.workplaceId===workplaceId&&Number.isFinite(Number(x.actualNet))&&Number.isFinite(Number(x.predictedNet)));if(!recs.length)return 0;return recs.reduce((a,x)=>a+(Number(x.actualNet)-Number(x.predictedNet)),0)/recs.length}
function calibratedPayout(){const p=payoutTakehome();const by=p.by.map(w=>{const correction=correctionForWorkplace(w.id);return{...w,correction,calibratedTake:Math.max(0,w.take+correction)}});return{...p,by,calibratedTake:by.reduce((a,w)=>a+w.calibratedTake,0)}}

      {id:'night',name:'夜勤',color:'#5f9df5',start:w.nightStart||w.defaultStart||'16:30',end:w.nightEnd||w.defaultEnd||'09:30',breakMinutes:Number(w.nightBreakMinutes??120),premiumBreakMinutes:0,payMode:w.nightPayMode||w.payMode||'daily',hourlyRate:Number(w.nightHourlyRate??w.hourlyRate??0),dailyRate:Number(w.nightDailyRate??w.dailyRate??0)},

function handleV39Click(e){
 const t=e.target.closest('[data-pay35open],[data-pay35back],[data-wp35-open],[data-wp35-back],[data-wp35-pattern-back],[data-p35open],[data-p35add],[data-p35del]');
 if(!t)return;
 if(t.hasAttribute('data-pay35open')){payEditorOpen=true;patternEditorId=null;render();return}
 if(t.hasAttribute('data-pay35back')){payEditorOpen=false;render();return}
 if(t.hasAttribute('data-wp35-open')){workplaceEditorId=t.dataset.wp35Open;patternEditorId=null;payEditorOpen=false;render();return}
 if(t.hasAttribute('data-wp35-back')){workplaceEditorId=null;patternEditorId=null;payEditorOpen=false;render();return}
 if(t.hasAttribute('data-wp35-pattern-back')){patternEditorId=null;render();return}
 if(t.hasAttribute('data-p35open')){patternEditorId=t.dataset.p35open;payEditorOpen=false;render();return}
 if(t.hasAttribute('data-p35add')){addPattern(workplaceEditorId);return}
 if(t.hasAttribute('data-p35del')){deletePattern(workplaceEditorId,t.dataset.p35del);return}
}
function handleV39Change(e){
 const t=e.target;
 if(t.matches('[data-p35]')){let v=t.value;if(t.type==='number')v=Number(v);setPattern(workplaceEditorId,t.dataset.p35,t.dataset.p35key,v);return}
 if(t.matches('[data-pay35rate]')){const w=state.workplaces.find(x=>x.id===workplaceEditorId);if(!w)return;const v=Number(t.value||0);w.hourlyRate=v;ensurePatterns(w).filter(p=>p.payMode==='hourly').forEach(p=>p.hourlyRate=v);save();render();return}
 if(t.matches('[data-pay35transport]')){const w=state.workplaces.find(x=>x.id===workplaceEditorId);if(!w)return;w.transportation=Number(t.value||0);save();render();return}
}

function v40PayrollEstimateHtml(){
  // 選択中の月 = 「振込月」。
  // 内訳も payoutTakehome().rows を使い、上の振込額と同じシフトだけを表示する。
  const p=payoutTakehome();
  const payoutRows=(p.rows||[]).slice().sort((a,b)=>
    (a.payDate||'').localeCompare(b.payDate||'') ||
    (a.date||'').localeCompare(b.date||'') ||
    (a.start||'').localeCompare(b.start||'')

      </div>`;
      main.insertBefore(toolbar, actual);

      // V47: 旧「勤務月見込み」と「振込見込み」を1画面に統合
      const v40=document.createElement('div');
      v40.className='v40-payroll-estimate';
      v40.innerHTML=v40PayrollEstimateHtml();
      main.insertBefore(v40, actual);
      payout.classList.add('payroll-hidden');
      estimate.classList.add('payroll-hidden');

      const applyPayrollView=()=>{
        actual.classList.toggle('payroll-hidden',payrollView!=='actual');
        v40.classList.toggle('payroll-hidden',payrollView!=='estimate');
        payout.classList.add('payroll-hidden');
        estimate.classList.add('payroll-hidden');
        toolbar.querySelectorAll('[data-pay-view]').forEach(b=>b.classList.toggle('active',b.dataset.payView===payrollView));
      };
      applyPayrollView();

      toolbar.querySelectorAll('[data-pay-view]').forEach(b=>b.onclick=()=>{
        payrollView=b.dataset.payView;
        applyPayrollView();
        window.scrollTo({top:0,behavior:'smooth'});
      });
      toolbar.querySelector('[data-pay-back]')?.addEventListener('click',()=>{state.tab='calendar';save();render();window.scrollTo({top:0,behavior:'smooth'})});
      toolbar.querySelectorAll('[data-pay-month]').forEach(b=>b.onclick=()=>changeMonth(Number(b.dataset.payMonth)));
    }
  }
  if(state.tab==='calendar'){
    app.querySelector('.workplace-panel')?.remove();
    app.querySelector('.tax-panel')?.remove();
  }
  if(state.tab==='workplaces') app.querySelector('.tax-panel')?.remove();
  if(state.tab==='workplaces'){
    const wp=app.querySelector('.workplace-panel'); if(wp)wp.innerHTML=workplaceV39();
  }
  if(state.tab==='calendar'){
    const aw=state.workplaces.find(w=>w.id===selectedWorkplaceId);
    const box=app.querySelector('.gmo-patterns');
    if(aw&&box){ensurePatterns(aw);box.innerHTML=aw.patterns.map(p=>`<button class="gmo-pattern" data-pick-workplace="${aw.id}" data-pick-kind="${p.id}" style="color:${p.color}">${esc(p.name)}<small>${p.start}〜${p.end}</small></button>`).join('')}
  }

  if(state.tab==='settings') app.querySelector('.workplace-panel')?.remove();
  app.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.tab;save();render()});
   app.querySelectorAll('[data-open-payroll]').forEach(el=>el.onclick=()=>{payrollView='estimate';state.tab='payroll';save();render();window.scrollTo({top:0,behavior:'smooth'})});
  
  app.querySelectorAll('[data-menu-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.menuTab;save();render();window.scrollTo({top:0,behavior:'smooth'})});
  app.querySelector('[data-act="prev"]')?.addEventListener('click',()=>changeMonth(-1)); app.querySelector('[data-act="next"]')?.addEventListener('click',()=>changeMonth(1));
  app.querySelector('#month')?.addEventListener('change',e=>{state.month=e.target.value;save();render()});
  app.querySelector('[data-act="ics"]')?.addEventListener('click',exportIcs);
  app.querySelectorAll('[data-adddate]').forEach(el=>el.onclick=()=>openShiftPicker(el.dataset.adddate));
  app.querySelectorAll('[data-select-workplace]').forEach(el=>el.onclick=()=>{
    selectedWorkplaceId=el.dataset.selectWorkplace;
    render();
  });
  app.querySelectorAll('[data-pick-workplace]').forEach(el=>el.onclick=()=>addShiftForDate(selectedShiftDate,el.dataset.pickWorkplace,el.dataset.pickKind));
  app.querySelectorAll('[data-edit-shift]').forEach(el=>el.onclick=()=>openShiftEditor(el.dataset.editShift));
  app.querySelectorAll('[data-edit-save]').forEach(el=>el.onclick=()=>saveShiftTime(el.dataset.editSave));
   app.querySelector('[data-detail-close]')?.addEventListener('click',()=>{editingShiftId=null;render()});
   app.querySelector('[data-detail-close-button]')?.addEventListener('click',()=>{editingShiftId=null;render()});
   app.querySelectorAll('[data-detail-delete]').forEach(el=>el.onclick=()=>{if(confirm('このシフトを削除する？'))deleteShiftQuick(el.dataset.detailDelete)});
  app.querySelector('[data-edit-cancel]')?.addEventListener('click',()=>{editingShiftId=null;render()});
  app.querySelectorAll('[data-quick-del]').forEach(el=>el.onclick=()=>deleteShiftQuick(el.dataset.quickDel));
  app.querySelector('[data-picker-close]')?.addEventListener('click',()=>{selectedShiftDate=null;editingShiftId=null;render()});
  app.querySelector('[data-picker-close-button]')?.addEventListener('click',()=>{selectedShiftDate=null;editingShiftId=null;render()});
  app.querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>deleteShiftQuick(el.dataset.del));
  app.querySelectorAll('[data-rule]').forEach(el=>el.onchange=e=>setRule(el.dataset.rule,e.target.value));
  app.querySelectorAll('[data-id][data-key]').forEach(el=>el.onchange=e=>{let v=e.target.value;if(e.target.type==='number')v=Number(v);setField(el.dataset.id,el.dataset.key,v)});
  app.querySelectorAll('[data-setting]').forEach(el=>el.onchange=e=>{let v=e.target.value;if(e.target.type==='number')v=Number(v);setSetting(el.dataset.setting,v)});
  app.querySelector('[data-act="add-workplace"]')?.addEventListener('click',addWorkplace);
  app.querySelector('[data-act="add-payslip"]')?.addEventListener('click',addPayslipFromForm);
  app.querySelectorAll('[data-slip-del]').forEach(el=>el.onclick=()=>{state.actualPayslips=state.actualPayslips.filter(x=>x.id!==el.dataset.slipDel);save();render()});
  app.querySelectorAll('[data-workplace-shift]').forEach(el=>el.onchange=e=>applyWorkplace(el.dataset.workplaceShift,e.target.value));
  app.querySelectorAll('[data-wdel]').forEach(el=>el.onclick=()=>deleteWorkplace(el.dataset.wdel));
  app.querySelector('[data-pay35open]')?.addEventListener('click',()=>{payEditorOpen=true;patternEditorId=null;render()});
  app.querySelector('[data-pay35back]')?.addEventListener('click',()=>{payEditorOpen=false;render()});
  app.querySelector('[data-pay35rate]')?.addEventListener('change',e=>{
    const w=state.workplaces.find(x=>x.id===workplaceEditorId);if(!w)return;
    const v=Number(e.target.value||0);w.hourlyRate=v;ensurePatterns(w).filter(p=>p.payMode==='hourly').forEach(p=>p.hourlyRate=v);save();render();
  });
  app.querySelector('[data-pay35transport]')?.addEventListener('change',e=>{const w=state.workplaces.find(x=>x.id===workplaceEditorId);if(!w)return;w.transportation=Number(e.target.value||0);save();render()});
  app.querySelectorAll('[data-wp35-open]').forEach(el=>el.onclick=()=>{workplaceEditorId=el.dataset.wp35Open;patternEditorId=null;payEditorOpen=false;render()});
  app.querySelector('[data-wp35-back]')?.addEventListener('click',()=>{workplaceEditorId=null;patternEditorId=null;payEditorOpen=false;render()});
  app.querySelector('[data-wp35-pattern-back]')?.addEventListener('click',()=>{patternEditorId=null;render()});
  app.querySelectorAll('[data-p35open]').forEach(el=>el.onclick=()=>{patternEditorId=el.dataset.p35open;render()});
  app.querySelector('[data-p35add]')?.addEventListener('click',()=>addPattern(workplaceEditorId));
  app.querySelectorAll('[data-p35]').forEach(el=>el.onchange=e=>{let v=e.target.value;if(e.target.type==='number')v=Number(v);setPattern(workplaceEditorId,el.dataset.p35,el.dataset.p35key,v)});
  app.querySelectorAll('[data-p35del]').forEach(el=>el.onclick=()=>deletePattern(workplaceEditorId,el.dataset.p35del));

  app.querySelectorAll('[data-wid][data-wkey]').forEach(el=>el.onchange=e=>{let v=e.target.type==='checkbox'?e.target.checked:e.target.value;if(e.target.type==='number')v=Number(v);setWorkplace(el.dataset.wid,el.dataset.wkey,v)});
}
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

app.addEventListener('click',handleV39Click);
app.addEventListener('change',handleV39Change);
</script></body></html>
