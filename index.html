<script>
const KEY='shift-pay-kagoshima-standalone-v6';
const SYS={health:.1013,pension:.183,child:.0023,ordinary:270000,special:400000};
const ACG={start:'16:30',end:'09:30',breakMinutes:120,dailyRate:22470};
const today=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2);
const ACG_ID='workplace-acg';
const defaultWorkplaces=()=>[{id:ACG_ID,name:'ACG',payMode:'daily',hourlyRate:1000,dailyRate:22470,defaultStart:'16:30',defaultEnd:'09:30',defaultBreakMinutes:120,defaultWorkKind:'night',defaultAllowance:0,socialInsuranceEnabled:true,employmentInsuranceEnabled:true,closingDay:0,paydayDay:25,paydayMonthOffset:1}];
const shiftFromWorkplace=(w,date=today())=>({id:uid(),date,start:w.defaultStart,end:w.defaultEnd,breakMinutes:w.defaultBreakMinutes,payMode:w.payMode,hourlyRate:w.hourlyRate,dailyRate:w.dailyRate,dailyRule:w.id===ACG_ID?'acgNight':'manual',holidayType:'normal',allowance:w.defaultAllowance,workKind:w.defaultWorkKind,memo:'',workplaceId:w.id});
let state={dark:true,tab:'calendar',month:today().slice(0,7),workplaces:defaultWorkplaces(),shifts:[shiftFromWorkplace(defaultWorkplaces()[0])],actualPayslips:[],settings:{healthRate:SYS.health,pensionRate:SYS.pension,employmentRate:.005,childSupportRate:SYS.child,residentTaxMonthly:0,municipality:'鹿児島市',disabilityBook:'mental',disabilityGrade:'2',annualOtherIncome:0,manualDisabilityClass:'auto'}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){state={...state,...s,settings:{...state.settings,...(s.settings||{})}};if(!state.workplaces?.length)state.workplaces=defaultWorkplaces();state.workplaces=state.workplaces.map(w=>({closingDay:0,paydayDay:25,paydayMonthOffset:1,...w}));state.shifts=(state.shifts||[]).map(x=>({...x,workplaceId:x.workplaceId||state.workplaces[0].id}));state.actualPayslips=Array.isArray(state.actualPayslips)?state.actualPayslips:[]}}catch{}
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const mins=s=>{const [h,m]=s.split(':').map(Number);return h*60+m};
const duration=(a,b)=>{let x=mins(a),y=mins(b);if(y<=x)y+=1440;return y-x};
function overlap(a,b,rs,re){let x=mins(a),y=mins(b);if(y<=x)y+=1440;let t=0;for(const o of [0,1440])t+=Math.max(0,Math.min(y,re+o)-Math.max(x,rs+o));return t}
const money=n=>Math.max(0,Math.round(n)).toLocaleString('ja-JP')+'円';
function inferDisability(book,grade){if(book==='none')return'none';if(book==='mental')return grade==='1'?'special':['2','3'].includes(grade)?'ordinary':'none';if(book==='physical')return['1','2'].includes(grade)?'special':grade?'ordinary':'none';if(book==='rehab')return /^A|重度/.test(grade)?'special':grade?'ordinary':'none';return'none'}
function salaryDeduction(i){if(i<=2200000)return Math.min(i,740000);if(i<=3600000)return i*.3+80000;if(i<=6600000)return i*.2+440000;if(i<=8500000)return i*.1+1100000;return 1950000}
function basicDeduction(i){if(i<=1320000)return 1040000;if(i<=3360000)return 880000;if(i<=4890000)return 680000;if(i<=6550000)return 630000;if(i<=23500000)return 620000;if(i<=24000000)return 480000;if(i<=24500000)return 320000;if(i<=25000000)return 160000;return 0}
function incomeTax(t){if(t<=0)return 0;const b=[[1950000,.05,0],[3300000,.1,97500],[6950000,.2,427500],[9000000,.23,636000],[18000000,.33,1536000],[40000000,.4,2796000],[Infinity,.45,4796000]].find(x=>t<=x[0]);return(t*b[1]-b[2])*1.021}
function addMonths(y,m,delta){const d=new Date(y,m-1+delta,1);return[d.getFullYear(),d.getMonth()+1]}
function lastDay(y,m){return new Date(y,m,0).getDate()}
function paymentInfo(s){const w=state.workplaces.find(x=>x.id===s.workplaceId);if(!w)return null;const d=new Date(s.date+'T00:00:00'),y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate(),close=Number(w.closingDay||0);let cy=y,cm=m;if(close>0&&day>close)[cy,cm]=addMonths(y,m,1);let[py,pm]=addMonths(cy,cm,Number(w.paydayMonthOffset||0));const pd=Math.min(Number(w.paydayDay||25),lastDay(py,pm));return{workplace:w,payDate:`${py}-${String(pm).padStart(2,'0')}-${String(pd).padStart(2,'0')}`}}
function shiftPay(s){const wm=Math.max(0,duration(s.start,s.end)-Number(s.breakMinutes||0)),h=wm/60,o=Math.max(0,h-8),nh=Math.min(wm,overlap(s.start,s.end,1320,1740))/60;let base=s.payMode==='daily'?Number(s.dailyRate||0):h*Number(s.hourlyRate||0);if(s.payMode==='hourly'){base+=nh*s.hourlyRate*.25;base+=o*s.hourlyRate*.25;if(s.holidayType==='statutory')base+=h*s.hourlyRate*.35}return{pay:base+Number(s.allowance||0),hours:h}}
function payoutSummary(){const rows=state.shifts.map(s=>{const pi=paymentInfo(s);if(!pi)return null;const sp=shiftPay(s);return{...s,...sp,payDate:pi.payDate,workplace:pi.workplace}}).filter(Boolean).filter(x=>x.payDate.startsWith(state.month));const by=state.workplaces.map(w=>{const ds=rows.filter(x=>x.workplaceId===w.id);return{id:w.id,name:w.name,count:ds.length,gross:ds.reduce((a,x)=>a+x.pay,0),payDates:[...new Set(ds.map(x=>x.payDate))].sort()}}).filter(x=>x.count);return{gross:rows.reduce((a,x)=>a+x.pay,0),count:rows.length,by}}
function payoutTakehome(){const rows=state.shifts.map(s=>{const pi=paymentInfo(s);if(!pi)return null;const sp=shiftPay(s);return{...s,...sp,payDate:pi.payDate,workplace:pi.workplace}}).filter(Boolean).filter(x=>x.payDate.startsWith(state.month));const st=state.settings,gross=rows.reduce((a,x)=>a+x.pay,0),socialGross=rows.filter(x=>x.workplace.socialInsuranceEnabled!==false).reduce((a,x)=>a+x.pay,0),employmentGross=rows.filter(x=>x.workplace.employmentInsuranceEnabled!==false).reduce((a,x)=>a+x.pay,0),health=socialGross*st.healthRate/2,pension=socialGross*st.pensionRate/2,child=socialGross*st.childSupportRate/2,employment=employmentGross*st.employmentRate,social=health+pension+child+employment,dc=st.manualDisabilityClass==='auto'?inferDisability(st.disabilityBook,st.disabilityGrade):st.manualDisabilityClass,ag=gross*12,si=Math.max(0,ag-salaryDeduction(ag)),as=social*12,dd=dc==='special'?SYS.special:dc==='ordinary'?SYS.ordinary:0,taxable=Math.max(0,si+st.annualOtherIncome-as-basicDeduction(si+st.annualOtherIncome)-dd),it=incomeTax(taxable)/12,ex=dc!=='none'&&(si+st.annualOtherIncome)<=1350000,rt=ex?0:Number(st.residentTaxMonthly||0),ded=social+it+rt,take=Math.max(0,gross-ded);const by=state.workplaces.map(w=>{const ds=rows.filter(x=>x.workplaceId===w.id),wg=ds.reduce((a,x)=>a+x.pay,0);if(!ds.length)return null;const wh=w.socialInsuranceEnabled!==false?wg*st.healthRate/2:0,wp=w.socialInsuranceEnabled!==false?wg*st.pensionRate/2:0,wc=w.socialInsuranceEnabled!==false?wg*st.childSupportRate/2:0,we=w.employmentInsuranceEnabled!==false?wg*st.employmentRate:0,share=gross>0?wg/gross:0,allocatedTax=(it+rt)*share,wd=wh+wp+wc+we+allocatedTax;return{id:w.id,name:w.name,count:ds.length,gross:wg,deductions:wd,take:Math.max(0,wg-wd),payDates:[...new Set(ds.map(x=>x.payDate))].sort()}}).filter(Boolean);return{rows,gross,health,pension,child,employment,it,rt,ded,take,dc,ex,by}}
function calc(){const shifts=state.shifts.filter(s=>s.date.startsWith(state.month)).sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));let gross=0,hours=0,night=0,ot=0;const details=shifts.map(s=>{const wm=Math.max(0,duration(s.start,s.end)-Number(s.breakMinutes||0)),h=wm/60,o=Math.max(0,h-8),nh=Math.min(wm,overlap(s.start,s.end,1320,1740))/60;let base=s.payMode==='daily'?Number(s.dailyRate||0):h*Number(s.hourlyRate||0);if(s.payMode==='hourly'){base+=nh*s.hourlyRate*.25;base+=o*s.hourlyRate*.25;if(s.holidayType==='statutory')base+=h*s.hourlyRate*.35}const pay=base+Number(s.allowance||0);gross+=pay;hours+=h;night+=nh;ot+=o;return{...s,workHours:h,pay}});const st=state.settings,socialGross=details.filter(s=>state.workplaces.find(w=>w.id===s.workplaceId)?.socialInsuranceEnabled!==false).reduce((a,s)=>a+s.pay,0),employmentGross=details.filter(s=>state.workplaces.find(w=>w.id===s.workplaceId)?.employmentInsuranceEnabled!==false).reduce((a,s)=>a+s.pay,0),health=socialGross*st.healthRate/2,pension=socialGross*st.pensionRate/2,child=socialGross*st.childSupportRate/2,employment=employmentGross*st.employmentRate,social=health+pension+child+employment,dc=st.manualDisabilityClass==='auto'?inferDisability(st.disabilityBook,st.disabilityGrade):st.manualDisabilityClass,ag=gross*12,si=Math.max(0,ag-salaryDeduction(ag)),as=social*12,dd=dc==='special'?SYS.special:dc==='ordinary'?SYS.ordinary:0,taxable=Math.max(0,si+st.annualOtherIncome-as-basicDeduction(si+st.annualOtherIncome)-dd),it=incomeTax(taxable)/12,ex=dc!=='none'&&(si+st.annualOtherIncome)<=1350000,rt=ex?0:Number(st.residentTaxMonthly||0),ded=social+it+rt;const byWorkplace=state.workplaces.map(w=>{const ds=details.filter(s=>s.workplaceId===w.id);return{id:w.id,name:w.name,count:ds.length,hours:ds.reduce((a,s)=>a+s.workHours,0),gross:ds.reduce((a,s)=>a+s.pay,0)}}).filter(x=>x.count);return{details,gross,hours,night,ot,health,pension,child,employment,it,rt,ded,take:gross-ded,dc,ex,byWorkplace}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shiftDates(s){const start=new Date(`${s.date}T${s.start}:00`),end=new Date(`${s.date}T${s.end}:00`);if(end<=start)end.setDate(end.getDate()+1);return{start,end}}
const gdate=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');
function googleUrl(s){const {start,end}=shiftDates(s),w=state.workplaces.find(x=>x.id===s.workplaceId),q=new URLSearchParams({action:'TEMPLATE',text:`${w?.name||'勤務先'} ${s.workKind==='night'?'夜勤':'勤務'}`,dates:`${gdate(start)}/${gdate(end)}`,details:`${s.memo||''}\n休憩 ${s.breakMinutes}分`});return'https://calendar.google.com/calendar/render?'+q}
function icsLocal(d){const p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`}
function exportIcs(){const ev=state.shifts.filter(s=>s.date.startsWith(state.month)).map(s=>{const{start,end}=shiftDates(s);return['BEGIN:VEVENT',`UID:${s.id}@shift-pay-kagoshima`,`DTSTAMP:${icsLocal(new Date())}`,`DTSTART;TZID=Asia/Tokyo:${icsLocal(start)}`,`DTEND;TZID=Asia/Tokyo:${icsLocal(end)}`,`SUMMARY:${state.workplaces.find(w=>w.id===s.workplaceId)?.name||'勤務先'} ${s.workKind==='night'?'夜勤':'勤務'}`,`DESCRIPTION:${(s.memo||'').replace(/\n/g,'\\n')}\\n休憩 ${s.breakMinutes}分`,'END:VEVENT'].join('\r\n')}).join('\r\n');const text=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Shift Pay Kagoshima//JA','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:シフト',ev,'END:VCALENDAR'].join('\r\n');const b=new Blob([text],{type:'text/calendar;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`shift-${state.month}.ics`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function changeMonth(delta){const[y,m]=state.month.split('-').map(Number),d=new Date(y,m-1+delta,1);state.month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;save();render()}
function setField(id,key,val){const s=state.shifts.find(x=>x.id===id);if(!s)return;s[key]=val;if(['start','end','breakMinutes','payMode','dailyRate'].includes(key))s.dailyRule='manual';save();render()}
function applyWorkplace(id,workplaceId){const s=state.shifts.find(x=>x.id===id),w=state.workplaces.find(x=>x.id===workplaceId);if(!s||!w)return;Object.assign(s,{workplaceId,payMode:w.payMode,hourlyRate:w.hourlyRate,dailyRate:w.dailyRate,start:w.defaultStart,end:w.defaultEnd,breakMinutes:w.defaultBreakMinutes,workKind:w.defaultWorkKind,allowance:w.defaultAllowance,dailyRule:w.id===ACG_ID?'acgNight':'manual'});save();render()}
function addWorkplace(){state.workplaces.push({id:uid(),name:`勤務先${state.workplaces.length+1}`,payMode:'hourly',hourlyRate:1000,dailyRate:10000,defaultStart:'09:00',defaultEnd:'18:00',defaultBreakMinutes:60,defaultWorkKind:'normal',defaultAllowance:0,socialInsuranceEnabled:false,employmentInsuranceEnabled:false,closingDay:0,paydayDay:25,paydayMonthOffset:1});save();render()}
function deleteWorkplace(id){if(state.workplaces.length<=1)return;const repl=state.workplaces.find(w=>w.id!==id);state.shifts=state.shifts.map(s=>s.workplaceId===id?{...s,workplaceId:repl.id}:s);state.workplaces=state.workplaces.filter(w=>w.id!==id);save();render()}
function setWorkplace(id,key,val){const w=state.workplaces.find(x=>x.id===id);if(!w)return;w[key]=val;save();render()}
function setRule(id,val){const s=state.shifts.find(x=>x.id===id);if(!s)return;s.dailyRule=val;if(val==='acgNight')Object.assign(s,{payMode:'daily',dailyRate:22470,start:'16:30',end:'09:30',breakMinutes:120,workKind:'night'});save();render()}
function setSetting(key,val){state.settings[key]=val;save();render()}

function correctionForWorkplace(workplaceId){const recs=state.actualPayslips.filter(x=>x.workplaceId===workplaceId&&Number.isFinite(Number(x.actualNet))&&Number.isFinite(Number(x.predictedNet)));if(!recs.length)return 0;return recs.reduce((a,x)=>a+(Number(x.actualNet)-Number(x.predictedNet)),0)/recs.length}
function calibratedPayout(){const p=payoutTakehome();const by=p.by.map(w=>{const correction=correctionForWorkplace(w.id);return{...w,correction,calibratedTake:Math.max(0,w.take+correction)}});return{...p,by,calibratedTake:by.reduce((a,w)=>a+w.calibratedTake,0)}}
function addPayslipFromForm(){const wid=document.getElementById('slip-workplace')?.value;const gross=Number(document.getElementById('slip-gross')?.value||0);const net=Number(document.getElementById('slip-net')?.value||0);const memo=document.getElementById('slip-memo')?.value||'';if(!wid||net<=0)return alert('勤務先と実際の手取り額を入力してね！');const p=payoutTakehome();const pred=p.by.find(x=>x.id===wid);state.actualPayslips.push({id:uid(),month:state.month,workplaceId:wid,actualGross:gross,actualNet:net,predictedNet:pred?pred.take:0,memo,createdAt:new Date().toISOString()});save();render()}

function render(){const r=calc(),app=document.getElementById('app');app.className='app'+(state.dark?' dark':'');const[y,m]=state.month.split('-').map(Number),first=new Date(y,m-1,1),last=new Date(y,m,0).getDate(),cells=[];for(let i=0;i<first.getDay();i++)cells.push(null);for(let d=1;d<=last;d++)cells.push(d);while(cells.length%7)cells.push(null);app.innerHTML=`<header><div><div class="eyebrow">2026・鹿児島対応 / V8</div><h1>シフト給与メーター</h1></div><button class="btn" data-act="theme">${state.dark?'☀️':'🌙'}</button></header><main><section><div class="hero"><span>${state.month} 手取り見込み</span><strong>${money(r.take)}</strong><small>額面 ${money(r.gross)} − 控除 ${money(r.ded)}</small></div><div class="metrics"><div><span>勤務時間</span><b>${r.hours.toFixed(1)}h</b></div><div><span>深夜</span><b>${r.night.toFixed(1)}h</b></div><div><span>残業</span><b>${r.ot.toFixed(1)}h</b></div><div><span>控除区分</span><b>${r.dc==='special'?'特別障害者':r.dc==='ordinary'?'障害者':'なし'}</b></div></div>${r.byWorkplace.length>1?`<div class="workplacebreakdown">${r.byWorkplace.map(w=>`<div><b>${esc(w.name)}</b><span>${w.count}勤務 / ${w.hours.toFixed(1)}h</span><strong>${money(w.gross)}</strong></div>`).join('')}</div>`:''}</section>${(()=>{const p=payoutTakehome();return `<section class="panel"><div class="panelhead"><div><h2 style="margin-bottom:2px">${state.month} 振込手取り見込み</h2><span class="fine">給料日ベース</span></div><strong style="font-size:24px">${money(p.take)}</strong></div><div class="notice">振込予定の額面 ${money(p.gross)} − 控除見込み ${money(p.ded)}。勤務先ごとの締め日・給料日を使って、この月に実際に入金される給与を集計します。</div>${p.by.length?`<div class="workplacebreakdown">${p.by.map(w=>`<div><b>${esc(w.name)}</b><span>${w.count}勤務 / ${w.payDates.map(d=>d.slice(5).replace('-','/')).join('・')}振込</span><strong>${money(w.take)}</strong><span>額面 ${money(w.gross)} / 控除目安 ${money(w.deductions)}</span></div>`).join('')}</div><div class="deductions" style="margin-top:10px"><div><span>健康保険</span><b>${money(p.health)}</b></div><div><span>厚生年金</span><b>${money(p.pension)}</b></div><div><span>子ども・子育て支援金</span><b>${money(p.child)}</b></div><div><span>雇用保険</span><b>${money(p.employment)}</b></div><div><span>所得税（概算）</span><b>${money(p.it)}</b></div><div><span>住民税</span><b>${money(p.rt)}${p.ex?'（非課税判定）':''}</b></div></div><p class="fine">※複数勤務先の所得税・住民税は実際の源泉徴収方法（甲欄・乙欄、扶養、会社処理等）で変わります。勤務先別の手取りは、月全体の税額を額面比で配分した目安です。</p>`:'<div class="emptymsg">この月の振込予定はまだありません。</div>'}</section>`})()}${(()=>{const p=calibratedPayout(),monthSlips=state.actualPayslips.filter(x=>x.month===state.month),allByWorkplace=state.workplaces.map(w=>{const recs=state.actualPayslips.filter(x=>x.workplaceId===w.id);return{w,recs,corr:correctionForWorkplace(w.id)}}).filter(x=>x.recs.length);return `<section class="panel"><div class="panelhead"><div><h2 style="margin-bottom:2px">給与明細・実績補正</h2><span class="fine">実際の振込額を記録して、勤務先ごとに予測を補正</span></div><strong>${money(p.calibratedTake)}</strong></div><div class="correction"><b>補正後の今月振込手取り見込み：${money(p.calibratedTake)}</b><div class="fine">実績がない勤務先は通常予測のまま。実績が増えると「実際 − 予測」の平均差を次回以降に反映します。</div></div><div class="card"><h3 style="margin-top:0">実際の給与明細を記録</h3><div class="slipgrid"><label>勤務先<select id="slip-workplace">${state.workplaces.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></label><label>実際の額面<input id="slip-gross" type="number" inputmode="numeric" placeholder="例 163715"></label><label>実際の手取り<input id="slip-net" type="number" inputmode="numeric" placeholder="例 138000"></label></div><label>メモ<input id="slip-memo" placeholder="例：2026年9月分給与"></label><button class="btn primary" data-act="add-payslip">＋ 給与明細を保存</button></div>${allByWorkplace.length?`<div class="workplacebreakdown">${allByWorkplace.map(x=>`<div><b>${esc(x.w.name)}</b><span>${x.recs.length}件の実績</span><strong class="${x.corr<0?'warn':'good'}">${x.corr>=0?'+':''}${money(Math.abs(x.corr)).replace('円','')}円/回 補正</strong><span>平均「実際 − 予測」</span></div>`).join('')}</div>`:''}<div class="card"><h3 style="margin-top:0">${state.month} の給与明細履歴</h3>${monthSlips.length?monthSlips.map(x=>{const w=state.workplaces.find(z=>z.id===x.workplaceId),d=Number(x.actualNet)-Number(x.predictedNet);return `<div class="sliprow"><div class="panelhead"><b>${esc(w?.name||'勤務先')}</b><button class="btn danger" data-slip-del="${x.id}">削除</button></div><div class="fine">予測 ${money(x.predictedNet)} → 実際 ${money(x.actualNet)}${x.actualGross?` / 額面 ${money(x.actualGross)}`:''}</div><div class="slipdelta ${d<0?'warn':'good'}">差額 ${d>=0?'+':''}${Math.round(d).toLocaleString('ja-JP')}円</div>${x.memo?`<div class="fine">${esc(x.memo)}</div>`:''}</div>`}).join(''):'<div class="emptymsg">この月の実際の給与明細はまだ登録されていません。</div>'}</div><p class="fine">※補正は税制そのものを変更するものではなく、会社独自の端数処理・源泉徴収・その他控除などによる「予測と実績の差」を勤務先ごとに平均して予測手取りへ加える簡易補正です。</p></section>`})()}<div class="ios-tabs"><button class="${state.tab==='calendar'?'active':''}" data-tab="calendar"><b>📅</b>シフト</button><button class="${state.tab==='workplaces'?'active':''}" data-tab="workplaces"><b>🏢</b>勤務先</button><button class="${state.tab==='settings'?'active':''}" data-tab="settings"><b>⚙️</b>設定</button></div>${state.tab==='calendar'?`<section class="panel"><div class="monthnav"><button class="btn" data-act="prev">‹</button><input id="month" type="month" value="${state.month}"><button class="btn" data-act="next">›</button></div><div class="weekdays">${['日','月','火','水','木','金','土'].map(x=>`<b>${x}</b>`).join('')}</div><div class="calendar">${cells.map(d=>{if(!d)return'<div class="day empty"></div>';const date=`${state.month}-${String(d).padStart(2,'0')}`,ds=r.details.filter(s=>s.date===date);return`<button class="day ${date===today()?'today':''}" data-adddate="${date}"><b>${d}</b>${ds.slice(0,3).map(s=>`<em>${esc(state.workplaces.find(w=>w.id===s.workplaceId)?.name||'勤務先')} ${s.start}</em>`).join('')}</button>`}).join('')}</div><div class="actions" style="margin-top:12px"><button class="btn" data-act="ics">⬇️ Apple/ICS</button><button class="btn primary" data-act="acg">＋ ACG夜勤</button></div></section><section class="panel"><div class="panelhead"><h2>${state.month} のシフト</h2><button class="btn primary" data-act="add">＋追加</button></div>${r.details.length? r.details.map(s=>`<div class="card"><div class="row"><input type="date" data-id="${s.id}" data-key="date" value="${s.date}"><button class="btn danger" data-del="${s.id}">削除</button></div><label>勤務先<select data-workplace-shift="${s.id}">${state.workplaces.map(w=>`<option value="${w.id}" ${s.workplaceId===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select></label><div class="grid2"><label>勤務種別<select data-id="${s.id}" data-key="workKind"><option value="normal" ${s.workKind==='normal'?'selected':''}>通常勤務</option><option value="night" ${s.workKind==='night'?'selected':''}>夜勤</option></select></label><label>日給ルール<select data-rule="${s.id}"><option value="manual" ${s.dailyRule==='manual'?'selected':''}>手動</option><option value="acgNight" ${s.dailyRule==='acgNight'?'selected':''}>ACG夜勤 22,470円</option></select></label></div><div class="grid2"><label>開始<input type="time" data-id="${s.id}" data-key="start" value="${s.start}"></label><label>終了<input type="time" data-id="${s.id}" data-key="end" value="${s.end}"></label></div><div class="grid2"><label>休憩（分）<input type="number" data-id="${s.id}" data-key="breakMinutes" value="${s.breakMinutes}"></label><label>休日区分<select data-id="${s.id}" data-key="holidayType"><option value="normal" ${s.holidayType==='normal'?'selected':''}>通常</option><option value="statutory" ${s.holidayType==='statutory'?'selected':''}>法定休日</option><option value="nonstatutory" ${s.holidayType==='nonstatutory'?'selected':''}>法定外休日</option></select></label></div><div class="grid2"><label>給与方式<select data-id="${s.id}" data-key="payMode"><option value="hourly" ${s.payMode==='hourly'?'selected':''}>時給</option><option value="daily" ${s.payMode==='daily'?'selected':''}>日給</option></select></label><label>${s.payMode==='hourly'?'時給':'日給'}<input type="number" data-id="${s.id}" data-key="${s.payMode==='hourly'?'hourlyRate':'dailyRate'}" value="${s.payMode==='hourly'?s.hourlyRate:s.dailyRate}"></label></div><div class="grid2"><label>交通費・手当<input type="number" data-id="${s.id}" data-key="allowance" value="${s.allowance}"></label><label>メモ<input data-id="${s.id}" data-key="memo" value="${esc(s.memo)}"></label></div><a class="btn google" target="_blank" href="${googleUrl(s)}">Googleカレンダーに追加 ↗</a><div class="total"><span>${s.workHours.toFixed(1)}時間</span><strong>${money(s.pay)}</strong></div></div>`).join(''):'<div class="emptymsg">まだシフトがないよ。日付をタップして追加できる！</div>'}</section>`:`<section class="panel workplace-panel"><h2>勤務先管理</h2><button class="btn primary workplace-add" data-act="add-workplace">＋ 新しい勤務先を追加</button><div class="panelhead"><span class="fine">登録済み勤務先</span><strong>${state.workplaces.length}件</strong></div><div class="notice">勤務先ごとに給与・標準勤務時間・締め日・給料日・保険計算の対象を保存できます。</div>${state.workplaces.map(w=>`<div class="card"><label>勤務先名<input data-wid="${w.id}" data-wkey="name" value="${esc(w.name)}"></label><div class="grid2"><label>給与方式<select data-wid="${w.id}" data-wkey="payMode"><option value="hourly" ${w.payMode==='hourly'?'selected':''}>時給</option><option value="daily" ${w.payMode==='daily'?'selected':''}>日給</option></select></label><label>${w.payMode==='hourly'?'時給':'日給'}<input type="number" data-wid="${w.id}" data-wkey="${w.payMode==='hourly'?'hourlyRate':'dailyRate'}" value="${w.payMode==='hourly'?w.hourlyRate:w.dailyRate}"></label></div><div class="grid2"><label>標準開始<input type="time" data-wid="${w.id}" data-wkey="defaultStart" value="${w.defaultStart}"></label><label>標準終了<input type="time" data-wid="${w.id}" data-wkey="defaultEnd" value="${w.defaultEnd}"></label></div><div class="grid2"><label>標準休憩（分）<input type="number" data-wid="${w.id}" data-wkey="defaultBreakMinutes" value="${w.defaultBreakMinutes}"></label><label>標準手当<input type="number" data-wid="${w.id}" data-wkey="defaultAllowance" value="${w.defaultAllowance}"></label></div><div class="grid2"><label>締め日<select data-wid="${w.id}" data-wkey="closingDay"><option value="0" ${Number(w.closingDay||0)===0?'selected':''}>末日</option>${Array.from({length:31},(_,i)=>i+1).map(d=>`<option value="${d}" ${Number(w.closingDay)===d?'selected':''}>${d}日</option>`).join('')}</select></label><label>支給月<select data-wid="${w.id}" data-wkey="paydayMonthOffset"><option value="0" ${Number(w.paydayMonthOffset||0)===0?'selected':''}>締め日と同じ月</option><option value="1" ${Number(w.paydayMonthOffset||0)===1?'selected':''}>翌月</option></select></label></div><label>給料日<select data-wid="${w.id}" data-wkey="paydayDay">${Array.from({length:31},(_,i)=>i+1).map(d=>`<option value="${d}" ${Number(w.paydayDay||25)===d?'selected':''}>${d}日</option>`).join('')}</select></label><div class="grid2"><label><input type="checkbox" data-wid="${w.id}" data-wkey="socialInsuranceEnabled" ${w.socialInsuranceEnabled?'checked':''}> 社会保険の計算対象</label><label><input type="checkbox" data-wid="${w.id}" data-wkey="employmentInsuranceEnabled" ${w.employmentInsuranceEnabled?'checked':''}> 雇用保険の計算対象</label></div>${state.workplaces.length>1?`<button class="btn danger" data-wdel="${w.id}">この勤務先を削除</button>`:''}</div>`).join('')}</section><section class="panel tax-panel"><h2>制度・控除設定</h2><div class="notice">変更はすぐ再計算され、この端末に自動保存されます。</div><div class="grid2"><label>自治体<input data-setting="municipality" value="${esc(state.settings.municipality)}"></label><label>住民税（月額）<input type="number" data-setting="residentTaxMonthly" value="${state.settings.residentTaxMonthly}"></label></div><div class="grid2"><label>手帳<select data-setting="disabilityBook"><option value="none" ${state.settings.disabilityBook==='none'?'selected':''}>なし</option><option value="mental" ${state.settings.disabilityBook==='mental'?'selected':''}>精神障害者保健福祉手帳</option><option value="physical" ${state.settings.disabilityBook==='physical'?'selected':''}>身体障害者手帳</option><option value="rehab" ${state.settings.disabilityBook==='rehab'?'selected':''}>療育手帳</option></select></label><label>等級<input data-setting="disabilityGrade" value="${esc(state.settings.disabilityGrade)}"></label></div><label>障害者控除判定<select data-setting="manualDisabilityClass"><option value="auto" ${state.settings.manualDisabilityClass==='auto'?'selected':''}>自動判定</option><option value="none" ${state.settings.manualDisabilityClass==='none'?'selected':''}>なし</option><option value="ordinary" ${state.settings.manualDisabilityClass==='ordinary'?'selected':''}>障害者</option><option value="special" ${state.settings.manualDisabilityClass==='special'?'selected':''}>特別障害者</option></select></label><div class="grid2"><label>健康保険率<input type="number" step="0.0001" data-setting="healthRate" value="${state.settings.healthRate}"></label><label>厚生年金率<input type="number" step="0.0001" data-setting="pensionRate" value="${state.settings.pensionRate}"></label></div><div class="grid2"><label>雇用保険率（本人）<input type="number" step="0.0001" data-setting="employmentRate" value="${state.settings.employmentRate}"></label><label>子ども・子育て支援金率<input type="number" step="0.0001" data-setting="childSupportRate" value="${state.settings.childSupportRate}"></label></div><label>給与以外の年間所得<input type="number" data-setting="annualOtherIncome" value="${state.settings.annualOtherIncome}"></label><div class="deductions"><div><span>健康保険</span><b>${money(r.health)}</b></div><div><span>厚生年金</span><b>${money(r.pension)}</b></div><div><span>子ども・子育て支援金</span><b>${money(r.child)}</b></div><div><span>雇用保険</span><b>${money(r.employment)}</b></div><div><span>所得税（概算）</span><b>${money(r.it)}</b></div><div><span>住民税</span><b>${money(r.rt)}${r.ex?'（非課税判定）':''}</b></div></div><p class="fine">※手取りは見込みです。実際の控除額は標準報酬月額、源泉徴収税額表、扶養状況、年末調整、会社の端数処理などで差が出ます。</p></section>`}</main><footer style="max-width:900px;margin:auto;padding:18px">データはこの端末に自動保存。勤務先ごとの締め日・給料日から振込を集計し、実際の給与明細から勤務先別に予測差を補正します。</footer>`;
  if(state.tab==='workplaces') app.querySelector('.tax-panel')?.remove();
  if(state.tab==='settings') app.querySelector('.workplace-panel')?.remove();
  if(!['calendar','workplaces','settings'].includes(state.tab)) state.tab='calendar';
  app.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.tab;save();render()});
  app.querySelector('[data-act="theme"]')?.addEventListener('click',()=>{state.dark=!state.dark;save();render()});
  app.querySelector('[data-act="prev"]')?.addEventListener('click',()=>changeMonth(-1)); app.querySelector('[data-act="next"]')?.addEventListener('click',()=>changeMonth(1));
  app.querySelector('#month')?.addEventListener('change',e=>{state.month=e.target.value;save();render()});
  app.querySelector('[data-act="ics"]')?.addEventListener('click',exportIcs);
  app.querySelector('[data-act="add"]')?.addEventListener('click',()=>{state.shifts.push(shiftFromWorkplace(state.workplaces[0],state.month+'-01'));save();render()});
  app.querySelector('[data-act="acg"]')?.addEventListener('click',()=>{{const w=state.workplaces.find(x=>x.id===ACG_ID)||state.workplaces[0];state.shifts.push(shiftFromWorkplace(w,state.month+'-01'))};save();render()});
  app.querySelectorAll('[data-adddate]').forEach(el=>el.onclick=()=>{state.shifts.push(shiftFromWorkplace(state.workplaces[0],el.dataset.adddate));save();render()});
  app.querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{state.shifts=state.shifts.filter(s=>s.id!==el.dataset.del);save();render()});
  app.querySelectorAll('[data-rule]').forEach(el=>el.onchange=e=>setRule(el.dataset.rule,e.target.value));
  app.querySelectorAll('[data-id][data-key]').forEach(el=>el.onchange=e=>{let v=e.target.value;if(e.target.type==='number')v=Number(v);setField(el.dataset.id,el.dataset.key,v)});
  app.querySelectorAll('[data-setting]').forEach(el=>el.onchange=e=>{let v=e.target.value;if(e.target.type==='number')v=Number(v);setSetting(el.dataset.setting,v)});
  app.querySelector('[data-act="add-workplace"]')?.addEventListener('click',addWorkplace);
  app.querySelector('[data-act="add-payslip"]')?.addEventListener('click',addPayslipFromForm);
  app.querySelectorAll('[data-slip-del]').forEach(el=>el.onclick=()=>{state.actualPayslips=state.actualPayslips.filter(x=>x.id!==el.dataset.slipDel);save();render()});
  app.querySelectorAll('[data-workplace-shift]').forEach(el=>el.onchange=e=>applyWorkplace(el.dataset.workplaceShift,e.target.value));
  app.querySelectorAll('[data-wdel]').forEach(el=>el.onclick=()=>deleteWorkplace(el.dataset.wdel));
  app.querySelectorAll('[data-wid][data-wkey]').forEach(el=>el.onchange=e=>{let v=e.target.type==='checkbox'?e.target.checked:e.target.value;if(e.target.type==='number')v=Number(v);setWorkplace(el.dataset.wid,el.dataset.wkey,v)});
}
render();
